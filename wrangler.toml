name = "polymarket-scanner"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "b4b3d8d5e1d7a7c2d0d35d9863bfd988"

[[kv_namespaces]]
binding = "SIGNALS_CACHE"
id = "591fb82d52b14b408378eeee28bd3a25"

# Twilio credentials are stored as Wrangler secrets, not committed vars.
# The code reads: TWILIO_SID, TWILIO_AUTH, TWILIO_PHONE (see sendSMS in index.js).
# Set them with: wrangler secret put TWILIO_SID (etc.)
#
# Agent investigation (optional): the web-search agent needs an Anthropic key.
#   wrangler secret put ANTHROPIC_API_KEY
# Model/cost knobs are plain vars, safe to commit; override as needed, e.g.:
#   INVESTIGATION_MODEL = "claude-opus-4-8"   (default; flip to sonnet/haiku to cut cost)

# D1 analytics DB (queryable mirror of agent analytics + signal settlement
# history). Schema: migrations/0001_init.sql + 0002_signal_outcomes.sql
# (both applied to the remote database).
[[d1_databases]]
binding = "DB"
database_name = "polymarket-scanner"
database_id = "524fc0f8-e5dd-46d1-a93b-156857668363"

[triggers]
crons = ["*/5 * * * *", "* * * * *"]   # minute trigger = src/xvenue.js sampler only

[vars]
# Accounts + billing (src/auth.js, src/tiers.js, src/billing.js). AUTH_GATE="on"
# makes member routes require a Supabase sign-in and enforces plans; leave
# "off" until the sign-in frontend is live. SUPABASE_URL is public (the
# project's API URL); the JWT secret / service role key are wrangler secrets
# pushed by push-billing-keys.yml. Stripe price ids are not secrets.
AUTH_GATE = "off"
SUPABASE_URL = "https://degwrimopajnndtxftfh.supabase.co"
STRIPE_PRICE_PRO_FOUNDING = "price_1UQzEHJlttnL5vK2ll7RP7xu"
STRIPE_PRICE_PRO_MONTHLY = "price_1UQziaJlttnL5vK2sIwdNtGh"
STRIPE_PRICE_PRO_ANNUAL = "price_1UQzieJlttnL5vK2If47w9xu"
STRIPE_PRICE_DESK_MONTHLY = "price_1UQzy3JlttnL5vK2NBgI0ywr"
STRIPE_PRICE_DESK_ANNUAL = "price_1UR0J1JlttnL5vK2PsPoh0fm"
# Agent investigation defaults. The ANTHROPIC_API_KEY secret activates the
# investigator; these bound its cost. Sonnet is ~5x cheaper than Opus per
# investigation — calibration (agent vs market Brier) will show whether the
# cheaper model prices markets well enough before any scale-up.
INVESTIGATION_MODEL = "claude-sonnet-5"
INVESTIGATION_PER_RUN = "2"
INVESTIGATION_DAILY_CAP = "20"
# Hard dollar ceiling per day, enforced from REAL usage tokens (the count cap
# above is only a secondary bound — call sizes vary 10x with search volume).
# Oct 2026: $5 -> $1 so the operator's $10 of credits isn't drained in two
# days; the Agent Crew (claude-haiku-5-5, CREW_LLM_DAILY_USD) shares the account.
INVESTIGATION_DAILY_USD = "1"
# 3 searches covers resolution criteria + key facts; search results are the
# dominant token cost (5 searches ran ~$1/investigation on Sep 8).
INVESTIGATION_MAX_SEARCHES = "3"
# One retry, not two — a market that failed twice rarely succeeds third time,
# and each retry is a full-priced research run.
INVESTIGATION_MAX_ATTEMPTS = "2"
