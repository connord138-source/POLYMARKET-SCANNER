name: Apply D1 Migration

# Applies one migration file to the production D1 database via wrangler,
# using the same Cloudflare credentials the deploy workflow uses. Pick the
# file when dispatching. ALTER TABLE re-runs fail loudly (duplicate column)
# rather than corrupting anything, so re-running is safe.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Migration file to apply"
        required: true
        default: "migrations/0004_market_impact.sql"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -f "${{ github.event.inputs.file }}" || { echo "::error::No such file: ${{ github.event.inputs.file }}"; exit 1; }
          npx wrangler@4 d1 execute polymarket-scanner --remote --file="${{ github.event.inputs.file }}"
          echo "Applied ${{ github.event.inputs.file }}"
