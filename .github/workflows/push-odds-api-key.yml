name: Push Odds API Key

# Pushes the ODDS_API_KEY GitHub repo secret into the worker as a wrangler
# secret, same pattern as Push Anthropic Key. Use it when the key changes or
# the plan is renewed: add or update the repo secret first (Settings >
# Secrets and variables > Actions > ODDS_API_KEY = the key from
# the-odds-api.com, Account), then run this. The sportsbook feed, the edge
# scanner and the crew's pricing pick the new key up on the next request;
# the edge scanner resumes once the key reports 150+ credits remaining.

on:
  workflow_dispatch:
    inputs:
      odds_api_key:
        description: "Fallback only: paste the key here if the repo secret cannot be read (it is masked in the log)"
        required: false
        default: ""

jobs:
  push-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push ODDS_API_KEY repo secret into the worker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || inputs.odds_api_key }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::add-mask::$ODDS_API_KEY"
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY is empty. Add it as a REPOSITORY secret under Settings > Secrets and variables > Actions > Secrets tab (not Variables, not Dependabot, not Codespaces, not an Environment), named exactly ODDS_API_KEY, then re-run; or re-run with the key in the odds_api_key input."
            exit 1
          fi
          printf '%s' "$ODDS_API_KEY" | npx wrangler@4 secret put ODDS_API_KEY
          echo "Key pushed. The next sportsbook request uses it; crew.oddsApi.remaining in status/backend.json shows the new credit count."
