name: Copy Wallet

# Feed the copy-a-whale agent a wallet from GitHub (the same thing the Copy
# a whale page's add box does with the admin token): add, pause, resume or
# remove a wallet. Uses the ADMIN_TOKEN repo secret.

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Wallet address (0x + 40 hex characters)"
        required: true
      nickname:
        description: "Nickname shown on the page (optional)"
        required: false
        default: ""
      action:
        description: "add | pause | resume | remove"
        required: true
        default: "add"

jobs:
  copy-wallet:
    runs-on: ubuntu-latest
    steps:
      - name: Send the order to the worker
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADDRESS: ${{ github.event.inputs.address }}
          NICKNAME: ${{ github.event.inputs.nickname }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -e
          if [ -z "$ADMIN_TOKEN" ]; then echo "::error::ADMIN_TOKEN repo secret is not set"; exit 1; fi
          BASE="https://polymarket-scanner.connord138.workers.dev"
          case "$ACTION" in
            add)    PATH_="/agents/copy/wallets"; BODY=$(jq -n --arg a "$ADDRESS" --arg n "$NICKNAME" '{address:$a, nickname:$n}') ;;
            remove) PATH_="/agents/copy/wallets/remove"; BODY=$(jq -n --arg a "$ADDRESS" '{address:$a}') ;;
            pause)  PATH_="/agents/copy/wallets/toggle"; BODY=$(jq -n --arg a "$ADDRESS" '{address:$a, enabled:false}') ;;
            resume) PATH_="/agents/copy/wallets/toggle"; BODY=$(jq -n --arg a "$ADDRESS" '{address:$a, enabled:true}') ;;
            *) echo "::error::action must be add, pause, resume or remove"; exit 1 ;;
          esac
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" --data "$BODY" "$BASE$PATH_")
          echo "HTTP $code"
          jq '{success, error, wallets: [.wallets[]? | {address, nickname, enabled, addedAt}]}' /tmp/out.json || cat /tmp/out.json
          [ "$code" = "200" ]
